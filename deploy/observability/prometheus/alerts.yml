# Lottify Prometheus alerting rules — mirror of deploy/observability/alert-definitions.yaml.
#
# Families with an in-code detector AND a metric fire here. Families whose
# metrics are not yet produced (detector_status: rule_only in alert-definitions.yaml)
# are declared but inactive (commented); they activate once the backing metric
# exists. Reconciliation (F1) is wired to its produced metric so it is live.
groups:
  - name: lottify-operational
    rules:
      # F1 — reconciliation discrepancy (in-code detector + metric-backed)
      - alert: ReconciliationDiscrepancy
        expr: lottify_reconciliation_discrepancies > 0
        for: 5m
        labels:
          family: reconciliation_discrepancy
          severity: error
        annotations:
          summary: "Ledger/wallet reconciliation discrepancy detected"
          description: "lottify_reconciliation_discrepancies is {{ $value }} for 5m (family F1)."

      - alert: ReconciliationDiscrepancyCritical
        expr: lottify_reconciliation_discrepancies_critical > 0
        for: 5m
        labels:
          family: reconciliation_discrepancy
          severity: critical
        annotations:
          summary: "Critical reconciliation discrepancy requires escalation"
          description: "Critical reconciliation discrepancy present (family F1, critical)."

      # F2 — Confirm error / failure spike
