# Prometheus scrape configuration for the Lottify API ops surface (GH #92 / W5-F4).
#
# The ops endpoints (/metrics) are protected by a bearer token when
# OPS_AUTH_TOKEN is set (see apps/api/src/ops-auth.guard.ts). This scrape config
# supplies that token so a Prometheus server can pull metrics from a separate
# scrape path while public traffic never reaches the token-gated surface.
#
# Usage:
#   prometheus --config.file=deploy/observability/prometheus/prometheus.yml
#   with the alert rules at alerts.yml mounted (rule_files) and the value of
#   the API process's OPS_AUTH_TOKEN substituted for ${OPS_AUTH_TOKEN}.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: lottify-api
    metrics_path: /metrics
    bearer_token: ${OPS_AUTH_TOKEN}
    static_configs:
      - targets:
          - api:3000
        labels:
          service: lottify-api

  # F1 (reconciliation), F4 (stuck withdrawals) and F6 (outbox/queue lag) are
  # produced inside the worker process, which serves the same registry on its
  # health listener; without this target those families' rules would never see a
  # series. The worker /metrics route is bearer-gated by the same OPS_AUTH_TOKEN
  # rule as the API. One target per worker group (they share the health port).
  - job_name: lottify-worker
    metrics_path: /metrics
    bearer_token: ${OPS_AUTH_TOKEN}
    static_configs:
      - targets:
          - worker-scheduler-outbox:3100
        labels:
          service: lottify-worker
          worker_group: scheduler-outbox
      - targets:
          - worker-payment-reconciliation:3100
        labels:
          service: lottify-worker
          worker_group: payment-reconciliation
