services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lottify
      POSTGRES_PASSWORD: lottify
      POSTGRES_DB: lottify
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lottify -d lottify"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - lottify-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  lottify-postgres:
