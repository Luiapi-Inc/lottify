name: item-76-sync-api-docs

on:
  push:
    branches:
      - codex/member-api-final-contract-pass
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Download authoritative Item 8 contract artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34579419359 \
            --repo "$GITHUB_REPOSITORY" \
            --name generated-api-contract-1702a58a204a1dc77756767dcae21d689fb7d3ea \
            --dir /tmp/item-76-contract
          mkdir -p apps/api/openapi
          cp /tmp/item-76-contract/apps/api/openapi/openapi.json apps/api/openapi/openapi.json
      - name: Generate committed API documentation
        run: GITHUB_ACTIONS=false node apps/api/scripts/generate-api-docs.mjs
      - name: Commit generated API documentation when changed
        run: |
          git add docs/api/openapi.json docs/api/api-specification.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(api): refresh generated contract snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
