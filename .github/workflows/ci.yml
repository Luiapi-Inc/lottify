name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lottify
          POSTGRES_PASSWORD: lottify
          POSTGRES_DB: lottify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lottify -d lottify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://lottify:lottify@localhost:5432/lottify?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: "01234567890123456789012345678901"
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:migrate:deploy
      - run: pnpm openapi:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build

  container-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lottify
          POSTGRES_PASSWORD: lottify
          POSTGRES_DB: lottify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lottify -d lottify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://lottify:lottify@127.0.0.1:5432/lottify?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: "01234567890123456789012345678901"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:migrate:deploy
      - name: Build OCI images
        run: |
          docker build -f infra/docker/Dockerfile.api -t lottify-api:ci .
          docker build -f infra/docker/Dockerfile.worker -t lottify-worker:ci .
          docker build -f infra/docker/Dockerfile.member -t lottify-member:ci .
          docker build -f infra/docker/Dockerfile.admin -t lottify-admin:ci .
      - name: Smoke API container
        run: |
          docker run -d --name lottify-api --network host \
            -e APP_ENV -e API_PORT=3000 -e DATABASE_URL -e REDIS_URL -e JWT_ACCESS_SECRET \
            lottify-api:ci
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3000/internal/health/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1
          docker stop lottify-api
          docker rm lottify-api
      - name: Smoke worker container
        run: |
          docker run -d --name lottify-worker --network host \
            -e APP_ENV -e WORKER_GROUP=settlement -e WORKER_HEALTH_PORT=3100 \
            -e DATABASE_URL -e REDIS_URL -e JWT_ACCESS_SECRET \
            lottify-worker:ci
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3100/internal/health/ready
          docker stop lottify-worker
          docker rm lottify-worker
      - name: Smoke Member container
        run: |
          docker run -d --name lottify-member --network host -e PORT=3200 lottify-member:ci
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3200/
          docker stop lottify-member
          docker rm lottify-member
      - name: Smoke Admin container
        run: |
          docker run -d --name lottify-admin --network host -e PORT=3300 lottify-admin:ci
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3300/
          docker stop lottify-admin
          docker rm lottify-admin
      - name: Container logs on failure
        if: failure()
        run: |
          for name in lottify-api lottify-worker lottify-member lottify-admin; do
            docker logs "$name" 2>/dev/null || true
          done
