# Local Lottify orchestration defaults.
# Runtime availability reflects this active host session; this file does not
# contain credentials or select a model override.
repo: /home/ubuntu/lottify
runtime:
  providers:
    codex-host:
      available: true
      max_parallel: 5
  profiles:
    host-default:
      provider: codex-host
      model: null
      available: true
      capabilities:
        - repository
        - tools
  routing:
    default:
      - host-default
    roles:
      lead-agent:
        - host-default
    priorities: {}
